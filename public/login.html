<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Log in — Menu</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap" rel="stylesheet">
<style>
:root{--ink:#33443e;--muted:#70817a;--cream:#fffdf8;--coral:#dc8466;--coral-dark:#bb674e;--line:#e7e5dc;--white:#fff}
*{box-sizing:border-box;margin:0;padding:0}body{background:var(--cream);color:var(--ink);font-family:"DM Sans",system-ui,sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center}
.box{width:min(400px,calc(100% - 32px));background:var(--white);border-radius:20px;padding:32px;box-shadow:0 18px 45px rgba(72,84,75,.1);border:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:20px;margin-bottom:24px;justify-content:center}
.brand-mark{width:28px;height:28px;background:var(--ink);border-radius:9px 9px 9px 3px;transform:rotate(-8deg)}
h1{font-family:Fraunces,serif;font-size:26px;text-align:center;margin-bottom:6px}
.sub{text-align:center;color:var(--muted);font-size:14px;margin-bottom:24px}
label{display:block;font-size:13px;font-weight:600;margin-bottom:5px}
input{width:100%;padding:12px 14px;border:1.5px solid var(--line);border-radius:12px;font:inherit;background:var(--cream);margin-bottom:14px}
input:focus{outline:none;border-color:var(--coral)}
.btn{width:100%;padding:13px;border-radius:12px;font-weight:600;font-size:15px;border:0;cursor:pointer;background:var(--coral);color:#fff;box-shadow:0 4px 0 var(--coral-dark)}
.btn:disabled{opacity:.6}.toggle{text-align:center;margin-top:16px;font-size:14px;color:var(--muted)}
.toggle a{color:var(--coral);font-weight:600;cursor:pointer}.err{color:#c0392b;font-size:13px;margin-bottom:10px;display:none;text-align:center}
</style>
</head>
<body>
<div class="box">
  <div class="brand"><div class="brand-mark"></div>Menu</div>
  <h1 id="title">Welcome back</h1>
  <p class="sub" id="sub">Log in to manage your menus</p>
  <div class="err" id="err"></div>
  <form id="form">
    <div id="nameField" style="display:none"><label>Name</label><input name="name" id="name"></div>
    <label>Email</label><input type="email" name="email" id="email" required>
    <label>Password</label><input type="password" name="password" id="password" required minlength="4">
    <button type="submit" class="btn" id="btn">Log in</button>
  </form>
  <div class="toggle" id="toggle">Don't have an account? <a id="switch">Sign up</a></div>
</div>
<script>
let mode='login';
document.getElementById('switch').onclick=()=>{
  mode=mode==='login'?'register':'login';
  document.getElementById('title').textContent=mode==='login'?'Welcome back':'Create account';
  document.getElementById('sub').textContent=mode==='login'?'Log in to manage your menus':'Start taking orders in minutes';
  document.getElementById('btn').textContent=mode==='login'?'Log in':'Sign up';
  document.getElementById('nameField').style.display=mode==='register'?'block':'none';
  document.getElementById('toggle').innerHTML=mode==='login'?"Don't have an account? <a id='switch'>Sign up</a>":"Already have an account? <a id='switch'>Log in</a>";
  document.getElementById('switch').onclick=arguments.callee;
};
document.getElementById('form').onsubmit=async e=>{
  e.preventDefault();
  const err=document.getElementById('err');err.style.display='none';
  const btn=document.getElementById('btn');btn.disabled=true;
  const body={email:document.getElementById('email').value,password:document.getElementById('password').value};
  if(mode==='register')body.name=document.getElementById('name').value;
  try{
    const res=await fetch('/api/auth/'+(mode==='login'?'login':'register'),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body),credentials:'include'});
    const data=await res.json();
    if(!res.ok)throw new Error(data.error||'Failed');
    location.href='/my-menus';
  }catch(ex){err.textContent=ex.message;err.style.display='block';btn.disabled=false}
};
</script>
</body>
</html>
