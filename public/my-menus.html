<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My menus</title>
<style>body{font-family:system-ui,sans-serif;background:#fffdf8;color:#33443e;max-width:560px;margin:40px auto;padding:0 16px}a.card{display:block;background:#fff;border:1px solid #e7e5dc;border-radius:14px;padding:16px;margin-bottom:10px;color:inherit;text-decoration:none;font-weight:600}.btn{display:inline-block;background:#dc8466;color:#fff;padding:10px 18px;border-radius:10px;text-decoration:none;font-weight:600}</style></head><body>
<h1>My menus</h1><div id="l">Loading…</div><p><a class="btn" href="/create">+ New menu</a> <a href="#" onclick="fetch('/api/auth/logout',{method:'POST'}).then(()=>location='/')">Log out</a></p>
<script>fetch('/api/my-menus').then(r=>r.status==401?location='/login':r.json()).then(d=>{if(!d)return;l.innerHTML=d.menus.map(m=>`<a class="card" href="/dashboard/${m.slug}">${m.restaurant_name.replace(/</g,'&lt;')} <small style="color:#70817a">· ${m.currency}</small></a>`).join('')||'No menus yet.'})</script></body></html>
