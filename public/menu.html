<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"/>
<title>Menu</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap" rel="stylesheet">
<style>
:root{--ink:#33443e;--muted:#70817a;--cream:#fffdf8;--coral:#dc8466;--line:#e7e5dc;--white:#fff;--theme:#efc2ae}
*{box-sizing:border-box;margin:0;padding:0}body{background:var(--cream);color:var(--ink);font-family:"DM Sans",system-ui,sans-serif;padding-bottom:90px}
header{background:linear-gradient(135deg,var(--theme),#f5c9af);padding:28px 20px 20px;text-align:center;position:sticky;top:0;z-index:10}
header h1{font-family:Fraunces,serif;font-size:24px;margin-bottom:2px}header p{font-size:13px;color:var(--muted)}
.search-bar{padding:12px 16px;background:var(--white);border-bottom:1px solid var(--line);position:sticky;top:76px;z-index:9}
.search-bar input{width:100%;padding:10px 14px;border:1.5px solid var(--line);border-radius:12px;font:inherit;background:var(--cream)}
.filters{display:flex;gap:8px;padding:10px 16px;overflow-x:auto;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.chip{padding:7px 14px;border-radius:20px;font-size:13px;font-weight:600;background:var(--white);border:1.5px solid var(--line);white-space:nowrap;cursor:pointer}
.chip.active{background:var(--ink);color:#fff;border-color:var(--ink)}
.cats{padding:8px 16px 0;display:flex;gap:8px;overflow-x:auto}
.cat-btn{padding:8px 14px;border-radius:10px;font-size:13px;font-weight:600;background:transparent;color:var(--muted);border:0;white-space:nowrap;cursor:pointer}
.cat-btn.active{background:#f3eee7;color:var(--ink)}
.section{padding:16px}
.section h2{font-family:Fraunces,serif;font-size:18px;margin-bottom:12px;letter-spacing:-.3px}
.item{background:var(--white);border-radius:16px;padding:14px;margin-bottom:10px;display:flex;justify-content:space-between;gap:12px;border:1px solid var(--line);cursor:pointer;transition:box-shadow .15s}
.item:hover{box-shadow:0 4px 16px rgba(0,0,0,.06)}.item-info{flex:1}.item-info h3{font-size:15px;font-weight:600;margin-bottom:3px}
.item-info p{font-size:12.5px;color:var(--muted);line-height:1.4;margin-bottom:6px}
.tags{display:flex;gap:4px;flex-wrap:wrap}.tag{font-size:10px;font-weight:700;padding:2px 7px;border-radius:6px;background:#e9f1e4;color:#496052}
.tag.v{background:#dceadd}.tag.gf{background:#e4e0f0}.item-right{text-align:right;display:flex;flex-direction:column;align-items:flex-end;justify-content:space-between}
.price{font-weight:700;font-size:15px;color:var(--coral)}.add-btn{width:32px;height:32px;border-radius:10px;background:var(--ink);color:#fff;font-size:18px;display:grid;place-items:center;margin-top:8px}
.cart-bar{position:fixed;bottom:0;left:0;right:0;background:var(--ink);color:#fff;padding:14px 20px;display:none;align-items:center;justify-content:space-between;z-index:20;cursor:pointer}
.cart-bar.show{display:flex}.cart-bar span{font-weight:600}
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:30;align-items:flex-end;justify-content:center}
.modal.show{display:flex}.modal-content{background:var(--cream);border-radius:24px 24px 0 0;width:100%;max-width:480px;max-height:85vh;overflow-y:auto;padding:24px}
.modal h2{font-family:Fraunces,serif;font-size:22px;margin-bottom:16px}
.cart-item{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.qty{display:flex;align-items:center;gap:10px}.qty button{width:28px;height:28px;border-radius:8px;background:var(--white);border:1px solid var(--line);font-size:16px}
.total-row{display:flex;justify-content:space-between;font-size:18px;font-weight:700;margin:16px 0}
input,textarea,select{width:100%;padding:11px 13px;border:1.5px solid var(--line);border-radius:11px;font:inherit;background:var(--white);margin-bottom:12px}
label{font-size:12px;font-weight:600;display:block;margin-bottom:4px}
.btn{width:100%;padding:14px;border-radius:12px;font-weight:600;font-size:15px;background:var(--coral);color:#fff;border:0;cursor:pointer}
.btn:disabled{opacity:.6}.success{text-align:center;padding:30px 10px}.success h2{font-size:26px;margin-bottom:8px}
.empty{text-align:center;padding:40px;color:var(--muted)}
</style>
</head>
<body>
<header id="header"><h1 id="restName">Menu</h1><p id="restDesc"></p></header>
<div class="search-bar"><input id="search" placeholder="Search dishes…" type="search"></div>
<div class="filters" id="filters">
  <button class="chip active" data-f="all">All</button>
  <button class="chip" data-f="vegan">🌱 Vegan</button>
  <button class="chip" data-f="veg">🥬 Veg</button>
  <button class="chip" data-f="gf">🌾 GF</button>
</div>
<div class="cats" id="cats"></div>
<div id="menuList" class="section"></div>
<div class="cart-bar" id="cartBar"><span id="cartCount">0 items</span><span id="cartTotal"></span></div>

<div class="modal" id="cartModal">
  <div class="modal-content">
    <h2>Your order</h2>
    <div id="cartItems"></div>
    <div class="total-row"><span>Total</span><span id="modalTotal"></span></div>
    <label>Table number</label><input id="tableNum" placeholder="e.g. 4">
    <label>Your name</label><input id="custName" placeholder="Optional">
    <label>Note for kitchen</label><textarea id="custNote" rows="2" placeholder="No onions, extra spicy…"></textarea>
    <label>Order type</label>
    <select id="orderType"><option value="dine-in">Dine in</option><option value="takeaway">Takeaway</option></select>
    <button class="btn" id="placeOrder">Place order</button>
    <button class="btn" style="background:transparent;color:var(--muted);margin-top:8px" onclick="closeCart()">Continue browsing</button>
  </div>
</div>

<div class="modal" id="successModal">
  <div class="modal-content success">
    <div style="font-size:48px;margin-bottom:12px">✅</div>
    <h2>Order placed!</h2>
    <p id="orderNum" style="font-size:20px;font-weight:700;margin:8px 0"></p>
    <p style="color:var(--muted)">Estimated 15–25 min. We'll prepare it shortly.</p>
    <button class="btn" style="margin-top:20px" onclick="location.reload()">Back to menu</button>
  </div>
</div>

<script src="/currency.js"></script>
<script>
const slug=location.pathname.split('/').pop();
const params=new URLSearchParams(location.search);
let menuData=null,cart=[],filter='all',activeCat=null,currency='EUR';

async function load(){
  const res=await fetch('/api/menus/'+slug);
  if(!res.ok){document.getElementById('menuList').innerHTML='<div class="empty">Menu not found</div>';return}
  menuData=await res.json();
  const m=menuData.menu;
  document.getElementById('restName').textContent=m.restaurant_name;
  document.getElementById('restDesc').textContent=m.description||'';
  document.title=m.restaurant_name+' — Menu';
  if(m.theme_color){document.documentElement.style.setProperty('--theme',m.theme_color);document.getElementById('header').style.background=`linear-gradient(135deg,${m.theme_color},#f5c9af)`}
  currency=m.currency||'EUR';
  if(params.get('table'))document.getElementById('tableNum').value=params.get('table');
  renderCats();renderMenu();
}

function renderCats(){
  const el=document.getElementById('cats');
  el.innerHTML='<button class="cat-btn active" data-id="">All</button>';
  menuData.categories.forEach(c=>{
    const b=document.createElement('button');b.className='cat-btn';b.textContent=c.name;b.dataset.id=c.id;
    b.onclick=()=>{activeCat=c.id||null;document.querySelectorAll('.cat-btn').forEach(x=>x.classList.remove('active'));b.classList.add('active');renderMenu()};
    el.appendChild(b);
  });
  el.querySelector('[data-id=""]').onclick=()=>{activeCat=null;document.querySelectorAll('.cat-btn').forEach(x=>x.classList.remove('active'));el.querySelector('[data-id=""]').classList.add('active');renderMenu()};
}

function renderMenu(){
  const q=(document.getElementById('search').value||'').toLowerCase();
  let items=menuData.items.filter(i=>{
    if(activeCat&&i.category_id!=activeCat)return false;
    if(filter==='vegan'&&!i.is_vegan)return false;
    if(filter==='veg'&&!i.is_vegetarian)return false;
    if(filter==='gf'&&!i.is_gluten_free)return false;
    if(q&&!i.name.toLowerCase().includes(q)&&!(i.description||'').toLowerCase().includes(q))return false;
    return true;
  });
  const byCat={};
  menuData.categories.forEach(c=>byCat[c.id]={name:c.name,items:[]});
  byCat[null]={name:'Other',items:[]};
  items.forEach(i=>{(byCat[i.category_id]||byCat[null]).items.push(i)});
  let html='';
  for(const [cid,group] of Object.entries(byCat)){
    if(!group.items.length)continue;
    html+=`<div class="section"><h2>${esc(group.name)}</h2>`;
    group.items.forEach(i=>{
      let tags='';
      if(i.is_vegan)tags+='<span class="tag v">Vegan</span>';
      else if(i.is_vegetarian)tags+='<span class="tag">Veg</span>';
      if(i.is_gluten_free)tags+='<span class="tag gf">GF</span>';
      html+=`<div class="item" onclick="addToCart(${i.id})">
        <div class="item-info"><h3>${esc(i.name)}</h3><p>${esc(i.description||'')}</p><div class="tags">${tags}</div></div>
        <div class="item-right"><div class="price">${fmt(i.price,currency)}</div><div class="add-btn">+</div></div>
      </div>`;
    });
    html+='</div>';
  }
  document.getElementById('menuList').innerHTML=html||'<div class="empty">No items match</div>';
}

function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}

function addToCart(id){
  const item=menuData.items.find(i=>i.id===id);if(!item)return;
  const existing=cart.find(c=>c.id===id);
  if(existing)existing.qty++;else cart.push({id:item.id,name:item.name,price:item.price,qty:1});
  updateCartBar();
}

function updateCartBar(){
  const count=cart.reduce((s,c)=>s+c.qty,0);
  const total=cart.reduce((s,c)=>s+c.price*c.qty,0);
  const bar=document.getElementById('cartBar');
  if(count>0){bar.classList.add('show');document.getElementById('cartCount').textContent=count+' item'+(count>1?'s':'');document.getElementById('cartTotal').textContent=fmt(total,currency)}
  else bar.classList.remove('show');
}

document.getElementById('cartBar').onclick=()=>{
  const el=document.getElementById('cartItems');
  el.innerHTML=cart.map((c,i)=>`<div class="cart-item"><div><strong>${esc(c.name)}</strong><div style="font-size:13px;color:var(--muted)">${fmt(c.price*c.qty,currency)}</div></div>
    <div class="qty"><button onclick="event.stopPropagation();chgQty(${i},-1)">−</button><span>${c.qty}</span><button onclick="event.stopPropagation();chgQty(${i},1)">+</button></div></div>`).join('');
  document.getElementById('modalTotal').textContent=fmt(cart.reduce((s,c)=>s+c.price*c.qty,0),currency);
  document.getElementById('cartModal').classList.add('show');
};
function chgQty(i,d){cart[i].qty+=d;if(cart[i].qty<=0)cart.splice(i,1);updateCartBar();document.getElementById('cartBar').onclick()}
function closeCart(){document.getElementById('cartModal').classList.remove('show')}

document.getElementById('placeOrder').onclick=async()=>{
  if(!cart.length)return;
  const btn=document.getElementById('placeOrder');btn.disabled=true;btn.textContent='Placing…';
  const total=cart.reduce((s,c)=>s+c.price*c.qty,0);
  try{
    const res=await fetch('/api/orders',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({
      menuId:menuData.menu.id,items:cart.map(c=>({id:c.id,qty:c.qty})),tableNumber:document.getElementById('tableNum').value,
      customerName:document.getElementById('custName').value,customerNote:document.getElementById('custNote').value,
      orderType:document.getElementById('orderType').value
    })});
    const data=await res.json();
    if(!res.ok)throw new Error(data.error||'Failed');
    closeCart();document.getElementById('orderNum').textContent=data.orderNumber;
    document.getElementById('successModal').classList.add('show');cart=[];updateCartBar();
  }catch(e){alert(e.message);btn.disabled=false;btn.textContent='Place order'}
};

document.getElementById('search').oninput=()=>renderMenu();
document.querySelectorAll('.chip').forEach(c=>c.onclick=()=>{
  document.querySelectorAll('.chip').forEach(x=>x.classList.remove('active'));c.classList.add('active');
  filter=c.dataset.f;renderMenu();
});
load();
</script>
</body>
</html>
